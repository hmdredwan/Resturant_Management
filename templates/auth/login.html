<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RestaurantAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(-45deg, #0f172a, #0c4a6e, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
        }
        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
</head>
<body class="h-full gradient-bg flex items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-sky-500/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="text-center mb-8">
            <a href="{% url 'home' %}" class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400 to-indigo-600 items-center justify-center text-white text-2xl font-bold shadow-2xl shadow-sky-500/30 mb-4 hover:scale-105 transition">R</a>
            <h1 class="text-3xl font-bold text-white">RestaurantAI</h1>
            <p class="text-slate-400 mt-1">Staff sign in</p>
        </div>
        
        <div class="bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 p-8 shadow-2xl">
            <h2 class="text-xl font-semibold text-white mb-6">Sign in to your account</h2>
            
            {% if form.errors %}
            <div class="mb-4 p-3 rounded-lg bg-red-500/20 border border-red-500/40 text-red-200 text-sm">
                Invalid username or password.
            </div>
            {% endif %}
            
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
                    <input type="text" name="username" required autofocus
                           class="w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
                </div>
                <button type="submit"
                        class="w-full py-3 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-semibold shadow-lg hover:shadow-xl hover:from-sky-400 hover:to-indigo-500 transition transform hover:-translate-y-0.5">
                    Sign In
                </button>
            </form>
            
            <p class="mt-6 text-center text-sm text-slate-400">
                <a href="{% url 'home' %}" class="text-sky-400 hover:text-sky-300 transition inline-flex items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Back to homepage
                </a>
            </p>
        </div>
    </div>
</body>
</html>
