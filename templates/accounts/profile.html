{% extends "base.html" %}
{% block title %}Profile - RestaurantAI{% endblock %}
{% block page_title %}My Profile{% endblock %}
{% block page_subtitle %}Manage your account details{% endblock %}

{% block content %}
<div class="max-w-xl bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 animate-fade-in">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-500 mb-1">First Name</label>
                <input name="first_name" value="{{ user.first_name }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-500 mb-1">Last Name</label>
                <input name="last_name" value="{{ user.last_name }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-500 mb-1">Email</label>
            <input name="email" type="email" value="{{ user.email }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-500 mb-1">Phone</label>
            <input name="phone" value="{{ user.phone }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-500 mb-1">Role</label>
            <input value="{{ user.get_role_display }}" disabled class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-100 dark:bg-slate-900 text-sm text-slate-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-500 mb-1">Username</label>
            <input value="{{ user.username }}" disabled class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-100 dark:bg-slate-900 text-sm text-slate-500">
        </div>
        <button type="submit" class="px-5 py-2.5 rounded-lg bg-sky-500 hover:bg-sky-600 text-white text-sm font-medium">Save Changes</button>
    </form>
</div>
{% endblock %}
