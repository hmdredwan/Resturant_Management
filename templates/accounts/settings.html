{% extends "base.html" %}
{% block title %}Settings - RestaurantAI{% endblock %}
{% block page_title %}Restaurant Settings{% endblock %}
{% block page_subtitle %}System configuration{% endblock %}

{% block content %}
<div class="max-w-xl bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 animate-fade-in">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-500 mb-1">Restaurant Name</label>
            <input name="name" value="{{ settings.name }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-500 mb-1">Address</label>
            <textarea name="address" rows="2" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">{{ settings.address }}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-500 mb-1">Phone</label>
                <input name="phone" value="{{ settings.phone }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-500 mb-1">Email</label>
                <input name="email" type="email" value="{{ settings.email }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-500 mb-1">Tax Rate (%)</label>
                <input name="tax_rate" type="number" step="0.01" value="{{ settings.tax_rate }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-500 mb-1">Currency</label>
                <input name="currency" value="{{ settings.currency }}" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
            </div>
        </div>
        <button type="submit" class="px-5 py-2.5 rounded-lg bg-sky-500 hover:bg-sky-600 text-white text-sm font-medium">Save Settings</button>
    </form>
</div>
{% endblock %}
